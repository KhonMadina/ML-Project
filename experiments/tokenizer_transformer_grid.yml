experiment_name: "tokenizer_transformer_grid"
tracking: "mlflow"
mlflow_experiment: "khmer_tokenizer"

base:
  script: "modeling/train_transformer.py"
  input: "annotation/sample_data/final_dataset.csv"
  use_splits: true
  output_root: "runs/tokenizer_transformer_grid"

  fixed:
    epochs: 3
    batch_size: 16
    lr: 2e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    max_length: 192
    grad_accum: 1
    fp16: false
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1
    seed: 123
    normalize_all: true

# Grid over transformer backbones, latin handling, and tokenizer choices.
# For tokenizer_path, specify directories produced by tools/train_tokenizer.py.

grid:
  model_name:
    - "xlm-roberta-base"
    - "bert-base-multilingual-cased"
  norm_latin_action: ["none", "tag"]
  tokenizer_path:
    - null  # use built-in tokenizer
    # Uncomment and adjust after training tokenizers:
    # - "tokenizers/kh/unigram_8000"
    # - "tokenizers/kh/unigram_16000"
    # - "tokenizers/kh/unigram_32000"
    # - "tokenizers/kh/bpe_8000"
    # - "tokenizers/kh/bpe_16000"
    # - "tokenizers/kh/bpe_32000"
